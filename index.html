<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice - Student Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #2c3e50;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h3 {
            margin-top: 0;
            color: #3498db;
        }
        .card p {
            color: #666;
            font-size: 14px;
        }
        #player-container {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: #000;
        }
        .back-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-bottom: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .back-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>Calculus & Logic Activities</h1>
        <p>Select an assignment below to load the simulation grid.</p>
    </header>

    <!-- Clean Menu with Only Two Games -->
    <div class="grid" id="game-grid">
        <!-- Cookie Clicker -->
        <div class="card" onclick="runPlayer('https://github.io', 'Resource Optimization')">
            <h3>Resource Optimization</h3>
            <p>Incremental progression and multi-tier production logic.</p>
        </div>

        <!-- Moto X3M -->
        <div class="card" onclick="runPlayer('https://github.io', 'Velocity & Angular Physics')">
            <h3>Velocity & Angular Physics</h3>
            <p>Vector calculations using momentum and center-of-mass constraints.</p>
        </div>
    </div>

    <!-- Hidden Game Player Screen -->
    <div id="player-container">
        <button class="back-btn" onclick="closePlayer()">← Return to Menu</button>
        <h2 id="display-title" style="color: #2c3e50; margin-bottom: 15px;"></h2>
        <iframe id="target-frame" src="" allowfullscreen></iframe>
    </div>

    <script>
        function runPlayer(targetUrl, displayTitle) {
            document.getElementById('game-grid').style.display = 'none';
            document.getElementById('main-header').style.display = 'none';
            
            document.getElementById('display-title').innerText = displayTitle;
            document.getElementById('target-frame').src = targetUrl;
            
            document.getElementById('player-container').style.display = 'block';
        }

        function closePlayer() {
            document.getElementById('target-frame').src = '';
            document.getElementById('player-container').style.display = 'none';
            
            document.getElementById('game-grid').style.display = 'grid';
            document.getElementById('main-header').style.display = 'block';
        }
    </script>

</body>
</html>
