<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice - Student Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #2c3e50;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h3 {
            margin-top: 0;
            color: #3498db;
        }
        .card p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Calculus & Logic Activities</h1>
        <p>Select an assignment below to load the simulation grid.</p>
    </header>

    <div class="grid">
        <!-- Cookie Clicker Card -->
        <div class="card" onclick="launchGame('https://github.io')">
            <h3>Resource Optimization</h3>
            <p>Incremental progression and multi-tier production logic.</p>
        </div>

        <!-- Moto X3M Card -->
        <div class="card" onclick="launchGame('https://github.io')">
            <h3>Velocity & Angular Physics</h3>
            <p>Vector calculations using momentum and center-of-mass constraints.</p>
        </div>
    </div>

    <script>
        function launchGame(url) {
            // This creates a completely clean tab completely detached from your main domain history
            var win = window.open();
            win.document.body.style.margin = '0';
            win.document.body.style.height = '100vh';
            
            var iframe = win.document.createElement('iframe');
            iframe.style.border = 'none';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.src = url;
            
            win.document.body.appendChild(iframe);
        }
    </script>

</body>
</html>
