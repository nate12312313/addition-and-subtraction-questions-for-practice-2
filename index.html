<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice - Student Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #2c3e50;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h3 {
            margin-top: 0;
            color: #3498db;
        }
        .card p {
            color: #666;
            font-size: 14px;
        }
        /* Game Player Layout */
        #player-container {
            display: none;
            max-width: 950px;
            margin: 0 auto;
            text-align: center;
        }
        iframe {
            width: 100%;
            height: 650px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: #000;
        }
        .back-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-bottom: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .back-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <!-- Main Portal Menu -->
    <div id="portal-view">
        <header>
            <h1>Calculus & Logic Activities</h1>
            <p>Select an assignment below to load the simulation grid.</p>
        </header>

        <div class="grid">
            <div class="card" onclick="startSimulation('cookie-clicker.html', 'Resource Optimization Matrix')">
                <h3>Resource Optimization</h3>
                <p>Incremental progression and multi-tier production logic.</p>
            </div>
        </div>
    </div>

    <!-- Same-Page Game Player Screen -->
    <div id="player-container">
        <button class="back-btn" onclick="exitSimulation()">← Return to Menu</button>
        <h2 id="display-title" style="color: #2c3e50; margin-bottom: 15px;"></h2>
        <iframe id="target-frame" src="" allowfullscreen></iframe>
    </div>

    <script>
        function startSimulation(localFile, cleanTitle) {
            // Hide the main portal menu
            document.getElementById('portal-view').style.display = 'none';
            
            // Set up the game frame and title
            document.getElementById('display-title').innerText = cleanTitle;
            document.getElementById('target-frame').src = localFile; // Loads the file from your repo
            
            // Show the frame view on the exact same page
            document.getElementById('player-container').style.display = 'block';
        }

        function exitSimulation() {
            // Wipe the frame source to stop audio/running memory
            document.getElementById('target-frame').src = '';
            
            // Hide the player and bring back the portal menu
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('portal-view').style.display = 'block';
        }
    </script>

</body>
</html>
